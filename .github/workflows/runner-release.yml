# Checks daily for a new actions/runner release and opens a pull request that bumps the runner image's pin
# (.github/scripts/bump-runner.sh). GitHub stops accepting a runner that doesn't update itself 30 days after a newer
# release, so each one has to ship in a project release in time. Needs Settings → Actions → General → "Allow GitHub
# Actions to create and approve pull requests".
name: runner-release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open a pull request for a new actions/runner release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/bump-runner.sh
