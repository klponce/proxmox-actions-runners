# Runs every check (.github/scripts/check.sh) in the dev container's image, so CI uses the same pinned tools as local
# development.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the dev container image
        run: |
          docker build --build-arg USER_UID="$(id -u)" --build-arg USER_GID="$(id -g)" -t par-dev .devcontainer
      - name: Check
        env:
          # packer init downloads its plugin through GitHub's API, whose anonymous rate limit runners share.
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: docker run --rm -e PACKER_GITHUB_API_TOKEN -v "$PWD:$PWD" -w "$PWD" par-dev .github/scripts/check.sh
