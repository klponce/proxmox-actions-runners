version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      # Writes to stdout/stderr in the CLI aren't worth checking.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      # AGENTS.md: scaleSet, vmid, jobId, runnerName.
      attr-only: true
      key-naming-case: camel
      context: scope
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests write fixtures with fixed permissions and paths from the table.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/klponce/proxmox-actions-runners
